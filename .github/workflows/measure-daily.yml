# Same measurement on a DAILY .NET 11 servicing SDK (dotnet/runtime release/11.0), which has the depth limit + cycle
# detection backported on 2026-11-16 (#135334, from #135029 / #135438) in get_wrapper_shared_vtype; the 11.0.0
# release does not. (.NET 12 dailies cannot be used: browser-wasm there runs CoreCLR, no Mono AOT at all.)
# Runs by hand. The Report workflow can merge this run with a Measure AOT run (run_ids input).
name: Measure AOT (daily .NET 11)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DAILY_FEED: https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet11/nuget/v3/index.json

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        arm: [on, off]
    steps:
      - uses: actions/checkout@v4
      - name: Install daily .NET 11 SDK
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          bash dotnet-install.sh --channel 11.0 --quality daily --install-dir "$HOME/dotnet11d"
          echo "$HOME/dotnet11d" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/dotnet11d" >> "$GITHUB_ENV"
      - name: SDK version + daily feed
        run: |
          dotnet --version
          # Which runtime build is this? (must contain dotnet/runtime c0ce97cde, the 2026-11-16 backport)
          cat "$HOME/dotnet11d/sdk/$(dotnet --version)/.version" || true
          ls "$HOME/dotnet11d/shared/Microsoft.NETCore.App"
          cat "$HOME"/dotnet11d/shared/Microsoft.NETCore.App/*/Microsoft.NETCore.App.deps.json 2>/dev/null | head -0
          echo "{\"sdk\":{\"version\":\"$(dotnet --version)\"}}" > global.json
          cat > nuget.config <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <add key="dotnet11" value="$DAILY_FEED" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF
      - name: Install wasm-tools (daily)
        run: dotnet workload install wasm-tools --source "$DAILY_FEED" --source https://api.nuget.org/v3/index.json
      - name: Publish (AOT)
        run: |
          extra=""
          if [ "${{ matrix.arm }}" = "off" ]; then extra="-p:NoPolymorphicRecursion=true"; fi
          start=$(date +%s)
          dotnet publish src/Repro.csproj -c Release --nologo -p:ReproTfm=net11.0 $extra -o out -bl:pub.binlog | tee publish.log
          end=$(date +%s)
          # Guard: this leg is only meaningful if Mono AOT ran (aot-instances pass present).
          grep -q "aot-instances.dll -> aot-instances.dll.bc" publish.log || { echo "Mono AOT did not run"; exit 1; }
          echo "WALL=$((end-start))" >> "$GITHUB_ENV"
          echo "publish wall time: $((end-start)) s"
      - name: Extract timings
        if: always()
        run: |
          dotnet msbuild pub.binlog -noconlog "-flp:logfile=diag.log;verbosity=diagnostic;performancesummary" || true
          grep -m1 -o "Microsoft.NETCore.App.Runtime.AOT.linux-x64.Cross.browser-wasm/[^/]*" diag.log || true
          python3 tools/extract.py diag.log net11.0-daily ${{ matrix.arm }} "${WALL:-0}" result-net11.0-daily-${{ matrix.arm }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-net11.0-daily-${{ matrix.arm }}
          path: |
            result-net11.0-daily-${{ matrix.arm }}.json
            pub.binlog
      - uses: actions/upload-artifact@v4
        with:
          name: app-net11.0-daily-${{ matrix.arm }}
          path: out/wwwroot
