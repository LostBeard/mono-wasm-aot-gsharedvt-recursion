# Same measurement on a DAILY .NET 12 SDK built from dotnet/runtime main, which has the depth limit + cycle detection
# from dotnet/runtime #135029 / #135438 in get_wrapper_shared_vtype (not in 10.0.x, and not in the 11.0.0 release).
# Runs by hand. The Report workflow can merge this run with a Measure AOT run (run_ids input).
name: Measure AOT (daily .NET 12)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DAILY_FEED: https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet12/nuget/v3/index.json

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        arm: [on, off]
    steps:
      - uses: actions/checkout@v4
      - name: Install daily .NET 12 SDK
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          bash dotnet-install.sh --channel 12.0 --quality daily --install-dir "$HOME/dotnet12"
          echo "$HOME/dotnet12" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/dotnet12" >> "$GITHUB_ENV"
      - name: SDK version + daily feed
        run: |
          dotnet --version
          echo "{\"sdk\":{\"version\":\"$(dotnet --version)\"}}" > global.json
          cat > nuget.config <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <add key="dotnet12" value="$DAILY_FEED" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF
      - name: Install wasm-tools (daily)
        run: dotnet workload install wasm-tools --source "$DAILY_FEED" --source https://api.nuget.org/v3/index.json
      - name: Publish (AOT)
        run: |
          extra=""
          if [ "${{ matrix.arm }}" = "off" ]; then extra="-p:NoPolymorphicRecursion=true"; fi
          start=$(date +%s)
          dotnet publish src/Repro.csproj -c Release --nologo -p:ReproTfm=net12.0 $extra -o out -bl:pub.binlog
          end=$(date +%s)
          echo "WALL=$((end-start))" >> "$GITHUB_ENV"
          echo "publish wall time: $((end-start)) s"
      - name: Extract timings
        if: always()
        run: |
          dotnet msbuild pub.binlog -noconlog "-flp:logfile=diag.log;verbosity=diagnostic;performancesummary" || true
          grep -m1 -o "Microsoft.NETCore.App.Runtime.AOT.linux-x64.Cross.browser-wasm/[^/]*" diag.log || true
          python3 tools/extract.py diag.log net12.0-daily ${{ matrix.arm }} "${WALL:-0}" result-net12.0-daily-${{ matrix.arm }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-net12.0-daily-${{ matrix.arm }}
          path: |
            result-net12.0-daily-${{ matrix.arm }}.json
            pub.binlog
      - uses: actions/upload-artifact@v4
        with:
          name: app-net12.0-daily-${{ matrix.arm }}
          path: out/wwwroot
